name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The integration tests run against a real Postgres, as they do locally.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: volunteer
          POSTGRES_PASSWORD: volunteer
          POSTGRES_DB: volunteer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volunteer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://volunteer:volunteer@localhost:5432/volunteer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
