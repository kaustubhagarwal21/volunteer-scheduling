# Local development database only. Production uses a managed Postgres (see docs/architecture.md).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer
      POSTGRES_DB: volunteer_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
